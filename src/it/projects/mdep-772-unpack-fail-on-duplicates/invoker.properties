invoker.userPropertiesFile = cli.properties
# both goals read mdep.unpack.failOnDuplicates; resource1.txt and resource2.txt are mapped to the same path
invoker.goals.1 = clean ${project.groupId}:${project.artifactId}:${project.version}:unpack@unpack
invoker.buildResult.1 = failure
invoker.goals.2 = ${project.groupId}:${project.artifactId}:${project.version}:unpack-dependencies@unpack-dependencies
invoker.buildResult.2 = failure
